<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรโมชันพิเศษ - FreezeFly</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="auth-guard.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-xs">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 decoration-none">
                <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"></path>
                </svg>
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">FreezeFly</span>
            </a>
            <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                <a href="index.html" class="hover:text-emerald-600 transition">ค้นหาเที่ยวบิน</a>
                <a href="my-trips.html" class="hover:text-emerald-600 transition">ทริปของฉัน & ตรึงราคา</a>
                <a href="promotions.html" class="text-emerald-600 font-semibold">โปรโมชัน</a>
                <a href="contact.html" class="hover:text-emerald-600 transition">ติดต่อเรา</a>
            </div>
            <div id="authArea" class="flex items-center gap-4">
                <a href="login.html" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition">เข้าสู่ระบบ</a>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-to-b from-emerald-50/50 to-slate-50 py-10 px-6 border-b border-slate-100 text-center">
        <div class="max-w-3xl mx-auto">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Special Offers</span>
            <h1 class="text-3xl font-bold text-slate-900 mt-3">🎁 สิทธิพิเศษ & ส่วนลดการตรึงราคา</h1>
            <p class="text-slate-500 text-sm mt-2 font-light">รับคูปองส่วนลดค่าบริการตรึงราคาและสิทธิพิเศษสำหรับสมาชิก FreezeFly</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 flex-1 w-full">
        <div id="promoContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="col-span-3 text-center text-slate-400">กำลังโหลดโปรโมชัน...</p>
        </div>
    </main>

    <footer class="border-t border-slate-100 bg-white py-8 text-center text-xs text-slate-400 mt-auto">
        &copy; 2026 FreezeFly Technology. All rights reserved.
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (isLoggedIn()) loadPromotions();
        });

        async function loadPromotions() {
            const container = document.getElementById('promoContainer');
            try {
                const res = await apiFetch('/promotions');
                if (res.status === 401) return;
                if (!res.ok) throw new Error();
                const promos = await res.json();

                if (!promos || promos.length === 0) {
                    container.innerHTML = `<p class="col-span-3 text-center text-slate-400">ยังไม่มีโปรโมชันในขณะนี้</p>`;
                    return;
                }

                container.innerHTML = promos.map(p => `
                    <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-md">สิทธิพิเศษ</span>
                                <span class="text-xs text-slate-400">สถานะ: พร้อมใช้งาน</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">${escapeHtml(p.title)}</h3>
                            <p class="text-xs text-slate-500 mb-4">${escapeHtml(p.description)}</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl flex items-center justify-between border border-slate-200">
                            <span class="font-mono text-sm font-bold text-emerald-600">${escapeHtml(p.code)}</span>
                            <button data-code="${escapeHtml(p.code)}" class="copy-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition cursor-pointer">
                                คัดลอกโค้ด
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="col-span-3 text-center text-slate-400">ไม่สามารถเชื่อมต่อระบบโปรโมชันได้</p>`;
            }
        }

        // ใช้ event delegation แทนการฝังโค้ดลงใน onclick
        document.getElementById('promoContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.copy-btn');
            if (btn) copyCode(btn.dataset.code);
        });

        async function copyCode(code) {
            try {
                await navigator.clipboard.writeText(code);
                alert(`คัดลอกโค้ด ${code} เรียบร้อยแล้ว!`);
            } catch (err) {
                alert(`ไม่สามารถคัดลอกอัตโนมัติได้ โค้ดของคุณคือ: ${code}`);
            }
        }
    </script>
</body>
</html>
